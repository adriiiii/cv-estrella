<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Adrià Rodriguez | Cloud & Systems Engineer Portfolio</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Fira+Code:wght@400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://unpkg.com/aos@2.3.1/dist/aos.css" rel="stylesheet">

    <style>
        /* --- VARIABLES DE DISEÑO AVANZADAS --- */
        :root {
            --bg-deep: #020617;
            --bg-main: #0f172a;
            --card-bg: rgba(30, 41, 59, 0.7);
            --card-border: rgba(51, 65, 85, 0.5);
            --accent-primary: #38bdf8;
            --accent-secondary: #818cf8;
            --text-white: #f8fafc;
            --text-muted: #94a3b8;
            --nav-height: 85px;
            --transition-smooth: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
            --shadow-glow: 0 0 25px rgba(56, 189, 248, 0.15);
        }

        /* --- RESET & BASE --- */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', sans-serif;
            background-color: var(--bg-deep);
            color: var(--text-white);
            line-height: 1.7;
            overflow-x: hidden;
        }

        /* Fondo dinámico con degradados */
        body::before {
            content: "";
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: 
                radial-gradient(circle at 10% 20%, rgba(56, 189, 248, 0.05) 0%, transparent 40%),
                radial-gradient(circle at 90% 80%, rgba(129, 140, 248, 0.05) 0%, transparent 40%);
            z-index: -1;
        }

        /* --- NAVEGACIÓN PREMIUM --- */
        nav {
            position: fixed;
            top: 0;
            width: 100%;
            height: var(--nav-height);
            background: rgba(2, 6, 23, 0.85);
            backdrop-filter: blur(15px);
            border-bottom: 1px solid var(--card-border);
            z-index: 2000;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .nav-container {
            width: 100%;
            max-width: 1200px;
            padding: 0 2rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .logo {
            font-family: 'Fira Code', monospace;
            font-weight: 800;
            font-size: 1.5rem;
            background: linear-gradient(90deg, var(--accent-primary), var(--accent-secondary));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-decoration: none;
        }

        .nav-menu {
            display: flex;
            list-style: none;
            gap: 2.5rem;
        }

        .nav-menu a {
            text-decoration: none;
            color: var(--text-muted);
            font-size: 0.9rem;
            font-weight: 500;
            transition: var(--transition-smooth);
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .nav-menu a:hover {
            color: var(--accent-primary);
            text-shadow: 0 0 10px rgba(56, 189, 248, 0.5);
        }

        /* --- HERO SECTION --- */
        .hero {
            height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            padding: 0 1rem;
            position: relative;
        }

        .profile-container {
            position: relative;
            margin-bottom: 2.5rem;
            padding: 10px;
        }

        .profile-img {
            width: 220px;
            height: 220px;
            border-radius: 50%;
            object-fit: cover;
            border: 4px solid var(--accent-primary);
            box-shadow: var(--shadow-glow);
            transition: var(--transition-smooth);
        }

        .profile-img:hover {
            transform: scale(1.05);
            box-shadow: 0 0 40px rgba(56, 189, 248, 0.3);
        }

        .hero-badge {
            background: rgba(56, 189, 248, 0.1);
            color: var(--accent-primary);
            padding: 8px 20px;
            border-radius: 50px;
            border: 1px solid rgba(56, 189, 248, 0.3);
            font-family: 'Fira Code', monospace;
            font-size: 0.8rem;
            margin-bottom: 1.5rem;
            display: inline-block;
        }

        .hero-title {
            font-size: clamp(3rem, 10vw, 5rem);
            font-weight: 800;
            line-height: 1;
            margin-bottom: 1.5rem;
            background: linear-gradient(to bottom, #fff 0%, #94a3b8 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .hero-description {
            max-width: 650px;
            color: var(--text-muted);
            font-size: 1.2rem;
            margin-bottom: 3rem;
        }

        /* --- CONTENEDOR PRINCIPAL --- */
        .container {
            max-width: 1100px;
            margin: 0 auto;
            padding: 0 2rem;
        }

        section {
            padding: 100px 0;
        }

        .section-header {
            display: flex;
            align-items: center;
            gap: 20px;
            margin-bottom: 60px;
        }

        .section-header span {
            color: var(--accent-primary);
            font-family: 'Fira Code', monospace;
            font-size: 1.2rem;
        }

        .section-header h2 {
            font-size: 2.2rem;
            font-weight: 700;
            white-space: nowrap;
        }

        .section-line {
            height: 1px;
            background: var(--card-border);
            flex-grow: 1;
        }

        /* --- GRID DE PROYECTOS (NoSQLPATI) --- */
        .project-featured {
            background: linear-gradient(145deg, rgba(30, 41, 59, 0.9), rgba(15, 23, 42, 0.9));
            border: 1px solid var(--card-border);
            border-radius: 24px;
            padding: 40px;
            display: grid;
            grid-template-columns: 1fr;
            gap: 30px;
            transition: var(--transition-smooth);
            position: relative;
            overflow: hidden;
        }

        .project-featured::before {
            content: "GITHUB";
            position: absolute;
            right: -20px;
            top: 20px;
            font-size: 5rem;
            font-weight: 900;
            color: rgba(255,255,255,0.03);
            z-index: 0;
        }

        .project-featured:hover {
            border-color: var(--accent-primary);
            transform: translateY(-10px);
        }

        .project-tag {
            color: var(--accent-primary);
            font-family: 'Fira Code', monospace;
            font-size: 0.9rem;
            margin-bottom: 10px;
            display: block;
        }

        .project-title { font-size: 2rem; margin-bottom: 15px; }

        .project-description { color: var(--text-muted); margin-bottom: 25px; max-width: 800px; }

        .btn-github {
            display: inline-flex;
            align-items: center;
            gap: 12px;
            background: var(--text-white);
            color: var(--bg-deep);
            padding: 14px 28px;
            border-radius: 12px;
            text-decoration: none;
            font-weight: 700;
            transition: var(--transition-smooth);
        }

        .btn-github:hover {
            background: var(--accent-primary);
            transform: scale(1.05);
        }

        /* --- EXPERIENCIA Y FORMACIÓN (TIMELINE MEJORADO) --- */
        .cv-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 40px;
        }

        .timeline-container {
            position: relative;
            padding-left: 30px;
            border-left: 2px solid var(--card-border);
        }

        .cv-item {
            position: relative;
            margin-bottom: 50px;
            background: var(--card-bg);
            padding: 25px;
            border-radius: 16px;
            border: 1px solid var(--card-border);
            transition: var(--transition-smooth);
        }

        .cv-item:hover {
            border-color: var(--accent-primary);
            background: rgba(30, 41, 59, 0.9);
        }

        .cv-item::before {
            content: "";
            position: absolute;
            left: -41px;
            top: 25px;
            width: 20px;
            height: 20px;
            background: var(--bg-deep);
            border: 3px solid var(--accent-primary);
            border-radius: 50%;
        }

        .cv-date {
            font-family: 'Fira Code', monospace;
            color: var(--accent-primary);
            font-size: 0.85rem;
            margin-bottom: 10px;
            display: block;
        }

        .cv-company {
            color: var(--text-white);
            font-weight: 600;
            font-size: 1.1rem;
            display: block;
            margin-bottom: 10px;
        }

        /* --- STACK TÉCNICO (Grid de 500 líneas style) --- */
        .skills-container {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 20px;
        }

        .skill-group {
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            padding: 30px;
            border-radius: 20px;
        }

        .skill-group h3 {
            margin-bottom: 20px;
            display: flex;
            align-items: center;
            gap: 10px;
            color: var(--accent-secondary);
        }

        .skill-tag-list {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
        }

        .tag {
            background: rgba(255,255,255,0.05);
            padding: 6px 14px;
            border-radius: 8px;
            font-size: 0.85rem;
            border: 1px solid var(--card-border);
            color: var(--text-muted);
        }

        /* --- FOOTER & CONTACTO --- */
        .contact-section {
            text-align: center;
            background: linear-gradient(to bottom, transparent, rgba(56, 189, 248, 0.05));
            border-radius: 40px;
            padding: 80px 20px;
        }

        .contact-grid {
            display: flex;
            justify-content: center;
            gap: 30px;
            margin: 40px 0;
            flex-wrap: wrap;
        }

        .contact-card {
            background: var(--card-bg);
            padding: 20px 40px;
            border-radius: 15px;
            border: 1px solid var(--card-border);
            display: flex;
            align-items: center;
            gap: 15px;
            text-decoration: none;
            color: var(--text-white);
            transition: var(--transition-smooth);
        }

        .contact-card:hover {
            border-color: var(--accent-primary);
            background: var(--bg-main);
        }

        footer {
            padding: 60px 20px;
            text-align: center;
            border-top: 1px solid var(--card-border);
            color: var(--text-muted);
            font-size: 0.9rem;
        }

        /* --- RESPONSIVE --- */
        @media (max-width: 900px) {
            .cv-grid { grid-template-columns: 1fr; }
            .hero-title { font-size: 3.5rem; }
            .nav-menu { display: none; } /* Podrías añadir un menú hamburguesa */
